version: 0.1
# Workflows discover tests on the VM, so keep YAML 0.1 with mode: remote.
# YAML 0.2 finds 0 tests there and still reports the job as completed.
# On YAML 0.1, runson: ios queues for an iOS VM; the test opens an Android
# session, so it only needs linux.
runson: linux
autosplit: true
concurrency: 1
appium: true
globalTimeout: 20
testSuiteTimeout: 20
testSuiteStep: 20
runtime:
    language: python
    version: "3.11"
pre:
    - pip3 install -r requirements.txt
testDiscovery:
    type: raw
    mode: remote
    # same two entries as the c2 YAML, so concurrency is the only difference
    command: printf '%s\n' test_proverbial_app_flow proverbial_app_flow
testRunnerCommand: python3 -m pytest tests -k "$test"
jobLabel: ['HYP-RD', 'linux-runson', 'v0.1', 'c1', 'no-dynamicAllocation', 'no-mobileDC']
